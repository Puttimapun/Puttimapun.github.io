<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Model — 3D Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #07090c; }
  canvas { display: block; }
  #info {
    position: fixed; left: 18px; bottom: 18px;
    font: 13px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #cfd6e0; background: rgba(10,14,20,.6);
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 10px 14px; backdrop-filter: blur(6px); max-width: 80vw;
  }
  #info b { color: #fff; font-weight: 600; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 14px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #8b95a3;
    pointer-events: none; transition: opacity .4s;
  }
</style>
</head>
<body>
<div id="loading">กำลังโหลดโมเดล…</div>
<div id="info">
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

/* ====== แก้ข้อมูลตรงนี้ได้เลย ====== */
const MODEL_URL = 'https://puttimapun.github.io/model.glb';


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
scene.fog = new THREE.Fog(0x07090c, 22, 60);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(10, 7, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2, 0);
controls.maxPolarAngle = Math.PI * 0.49;

// ไฟ
scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x20160e, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(8, 14, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 60;
const d = 14;
key.shadow.camera.left = -d; key.shadow.camera.right = d;
key.shadow.camera.top = d;   key.shadow.camera.bottom = -d;
key.shadow.bias = -0.0008;
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.6);
rim.position.set(-9, 5, -8);
scene.add(rim);

// พื้นรับเงา
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// โหลดโมเดล
const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });

  // จัดให้โมเดลวางบนพื้นและอยู่กลางฉาก
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;
  scene.add(model);

  // ตั้งกล้องให้พอดีกับขนาดโมเดล
  const radius = Math.max(size.x, size.z) * 0.5;
  const dist = radius / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.9;
  camera.position.set(dist * 0.6, size.y * 0.9 + radius * 0.5, dist * 0.8);
  controls.target.set(0, size.y * 0.35, 0);
  controls.update();

  ground.position.y = 0.001;
  addText(size);

  const el = document.getElementById('loading');
  el.style.opacity = 0;
  setTimeout(() => el.remove(), 400);
}, (e) => {
  if (e.total) {
    document.getElementById('loading').textContent =
      'กำลังโหลดโมเดล… ' + Math.round(e.loaded / e.total * 100) + '%';
  }
}, (err) => {
  document.getElementById('loading').textContent =
    'โหลด model.glb ไม่สำเร็จ — ตรวจว่าไฟล์อยู่โฟลเดอร์เดียวกับหน้านี้';
  console.error(err);
});

// ข้อความ 3 มิติ
function addText(size) {
  new FontLoader().load(
    'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
    (font) => {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0xf2f4f8, roughness: 0.35, metalness: 0.15
      });
      const h = 0.42;

      LINES.forEach((line, i) => {
        const geo = new TextGeometry(line, {
          font, size: h, height: 0.06,
          curveSegments: 6, bevelEnabled: true,
          bevelThickness: 0.012, bevelSize: 0.008, bevelSegments: 2
        });
        geo.computeBoundingBox();
        geo.translate(-geo.boundingBox.min.x, 0, 0);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = -i * (h * 1.7);
        mesh.castShadow = true;
        group.add(mesh);
      });

      // วางป้ายข้อความไว้ด้านข้างเกาะ เอียงเล็กน้อยให้อ่านง่าย
      const x = Math.max(size.x, size.z) * 0.55 + 1.2;
      group.position.set(x, size.y * 0.95, -Math.max(size.x, size.z) * 0.1);
      group.rotation.y = -Math.PI / 5;
      scene.add(group);
    }
  );
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
