<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gen Rendering - Rusted Robot PBR Studio</title>

    <!-- ============================================================
         THREE.JS + LOADERS + CONTROLS + GUI
    ============================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: #111;
        }

        #info {
            position: fixed; left: 18px; top: 16px; z-index: 5;
            color: white; pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
        #info h1 { margin: 0 0 5px 0; font-size: 20px; font-weight: bold; }
        #info p { margin: 0; font-size: 12px; opacity: 0.9; }

        #hint {
            position: fixed; left: 18px; bottom: 18px; z-index: 5;
            color: white; background: rgba(0,0,0,0.4);
            padding: 8px 12px; border-radius: 8px; font-size: 12px;
            pointer-events: none;
        }

        #loading {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; color: white; background: #111; font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="loading">กำลังโหลดฉากและโมเดล...</div>

    <div id="info">
        <h1>Next Gen Rendering — Rusted Robot PBR Studio</h1>
        <p>Three.js • PBR Material • HDR Environment • Dynamic Shadows</p>
    </div>

    <div id="hint">
        ลากเมาส์ = หมุนกล้อง &nbsp;&nbsp;|&nbsp;&nbsp; Shift + ลาก = ขยับตำแหน่งแสง
    </div>

<script>
(() => {

    /* ============================================================
       RENDERER
    ============================================================= */
    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    document.body.appendChild(renderer.domElement);

    /* ============================================================
       SCENE + CAMERA
    ============================================================= */
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        45, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(4.5, 3.0, 7.5);

    /* ============================================================
       ORBIT CONTROLS
    ============================================================= */
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI / 2.02;

    /* ============================================================
       ENVIRONMENT 360° (HDRI)
    ============================================================= */
    const hdriUrl = "https://raw.githubusercontent.com/Puttimapun/Puttimapun.github.io/main/ferndale_studio_06_2k.hdr";

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const rgbeLoader = new THREE.RGBELoader();

    rgbeLoader
        .setDataType(THREE.UnsignedByteType)
        .load(
            hdriUrl,
            (texture) => {
                const envRT = pmremGenerator.fromEquirectangular(texture);
                scene.environment = envRT.texture;

                texture.mapping = THREE.EquirectangularReflectionMapping;
                texture.encoding = THREE.RGBEEncoding;
                scene.background = texture;

                pmremGenerator.dispose();
            },
            undefined,
            (error) => {
                console.error("HDRI loading error:", error);
                scene.background = new THREE.Color(0x9fb7c5);
                pmremGenerator.dispose();
            }
        );

    /* ============================================================
       AMBIENT LIGHT (แสงพื้นคงที่ ไม่มีใน GUI)
    ============================================================= */
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    /* ============================================================
       DIRECTIONAL LIGHT (+ SHADOW)
    ============================================================= */
    const directionalLight = new THREE.DirectionalLight(0xfff2d8, 1.5);
    directionalLight.castShadow = true;

    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.near = 0.1;
    directionalLight.shadow.camera.far = 30;
    directionalLight.shadow.camera.left = -8;
    directionalLight.shadow.camera.right = 8;
    directionalLight.shadow.camera.top = 8;
    directionalLight.shadow.camera.bottom = -8;
    directionalLight.shadow.bias = -0.0005;
    directionalLight.shadow.normalBias = 0.02;

    scene.add(directionalLight);

    directionalLight.target.position.set(0, 1, 0);
    scene.add(directionalLight.target);

    /* กล่อง/จุดแสดงตำแหน่งแหล่งกำเนิดแสง */
    const lightMarker = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 0.25, 0.25),
        new THREE.MeshBasicMaterial({ color: 0xffaa33 })
    );
    scene.add(lightMarker);

    /* ============================================================
       FLOOR (PBR MATERIAL)
    ============================================================= */
    const floorTexture = new THREE.TextureLoader().load(
        "https://raw.githubusercontent.com/Puttimapun/Puttimapun.github.io/main/rubber_tiles_ao_2k.jpg"
    );
    floorTexture.wrapS = THREE.RepeatWrapping;
    floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(8, 8);
    floorTexture.encoding = THREE.sRGBEncoding;

    const floorMaterial = new THREE.MeshStandardMaterial({
        map: floorTexture,
        color: 0xffffff,
        roughness: 0.85,
        metalness: 0.05
    });

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    /* ============================================================
       GUI SETTINGS
    ============================================================= */
    const settings = {

        /* ตำแหน่งแหล่งกำเนิดแสง */
        lightX: 5,
        lightY: 6,
        lightZ: 5,
        lightIntensity: 1.5,
        showLightMarker: true,
        autoRotateLight: false,

        /* PBR ของตัวละคร */
        baseColor: "#ffffff",
        metalness: 0.50,
        roughness: 0.50,

        /* ตำแหน่งหุ่นยนต์ */
        modelX: 0,
        modelY: 0,
        modelZ: 0

    };

    function updateLight() {
        directionalLight.position.set(
            settings.lightX,
            settings.lightY,
            settings.lightZ
        );

        directionalLight.intensity = settings.lightIntensity;
        directionalLight.target.position.set(0, 1, 0);

        lightMarker.position.copy(directionalLight.position);
        lightMarker.visible = settings.showLightMarker;
    }

    let model = null;
    let modelBasePosition = new THREE.Vector3();

    function updateModelPosition() {
        if (!model) return;

        model.position.set(
            modelBasePosition.x + settings.modelX,
            modelBasePosition.y + settings.modelY,
            modelBasePosition.z + settings.modelZ
        );
    }

    function updatePBR() {
        if (!model) return;

        const color = new THREE.Color(settings.baseColor);

        model.traverse((child) => {
            if (!child.isMesh || !child.material) return;

            const materials = Array.isArray(child.material)
                ? child.material
                : [child.material];

            materials.forEach((mat) => {
                if (mat.isMeshStandardMaterial) {
                    mat.color.copy(color);
                    mat.metalness = settings.metalness;
                    mat.roughness = settings.roughness;
                    mat.needsUpdate = true;
                }
            });
        });
    }

    /* ============================================================
       MODEL (ROBOT)
    ============================================================= */
    const modelUrl = "https://raw.githubusercontent.com/Puttimapun/Puttimapun.github.io/main/rusted-robot.glb";

    const gltfLoader = new THREE.GLTFLoader();

    gltfLoader.load(
        modelUrl,

        (gltf) => {
            model = gltf.scene;

            // จัดกึ่งกลางและปรับขนาดโมเดล
            const originalBox = new THREE.Box3().setFromObject(model);
            const originalSize = originalBox.getSize(new THREE.Vector3());
            const originalCenter = originalBox.getCenter(new THREE.Vector3());

            model.position.x -= originalCenter.x;
            model.position.z -= originalCenter.z;
            model.position.y -= originalBox.min.y;

            const maxDimension = Math.max(originalSize.x, originalSize.y, originalSize.z);
            if (maxDimension > 3) {
                const scale = 3 / maxDimension;
                model.scale.setScalar(scale);
            }

            const finalBox = new THREE.Box3().setFromObject(model);
            const finalCenter = finalBox.getCenter(new THREE.Vector3());
            model.position.x -= finalCenter.x;
            model.position.z -= finalCenter.z;
            model.position.y -= finalBox.min.y;

            modelBasePosition.copy(model.position);

            // material + shadow
            model.traverse((child) => {
                if (!child.isMesh) return;

                child.castShadow = true;
                child.receiveShadow = true;

                if (!child.material) return;

                const materials = Array.isArray(child.material)
                    ? child.material
                    : [child.material];

                materials.forEach((mat) => {
                    if (mat.isMeshStandardMaterial) {
                        mat.metalness = settings.metalness;
                        mat.roughness = settings.roughness;
                        mat.needsUpdate = true;
                        return;
                    }

                    const pbrMaterial = new THREE.MeshStandardMaterial({
                        map: mat.map || null,
                        color: mat.color ? mat.color.clone() : new THREE.Color(0xffffff),
                        normalMap: mat.normalMap || null,
                        roughness: settings.roughness,
                        metalness: settings.metalness
                    });

                    if (Array.isArray(child.material)) {
                        child.material = child.material.map((oldMat) =>
                            oldMat === mat ? pbrMaterial : oldMat
                        );
                    } else {
                        child.material = pbrMaterial;
                    }
                });
            });

            scene.add(model);

            const modelBox = new THREE.Box3().setFromObject(model);
            const modelCenter = modelBox.getCenter(new THREE.Vector3());

            controls.target.copy(modelCenter);
            controls.target.y += 0.15;

            camera.position.set(4.5, 2.8, 7.0);
            camera.lookAt(controls.target);

            updatePBR();

            document.getElementById("loading").style.display = "none";
        },

        (xhr) => {
            if (xhr.total) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById("loading").textContent =
                    "กำลังโหลดโมเดล... " + percent + "%";
            }
        },

        (error) => {
            console.error("GLB loading error:", error);
            document.getElementById("loading").textContent = "โหลดโมเดลไม่สำเร็จ";
        }
    );

    /* ============================================================
       CONTROL PANEL (lil-gui)
    ============================================================= */
    const gui = new lil.GUI({ title: "Control Panel" });

    const lightFolder = gui.addFolder("ควบคุมแสงและลูกเล่น");
    const ctrlLightX = lightFolder.add(settings, "lightX", -15, 15, 0.1).name("แกน X").onChange(updateLight);
    const ctrlLightY = lightFolder.add(settings, "lightY", 0, 20, 0.1).name("แกน Y").onChange(updateLight);
    const ctrlLightZ = lightFolder.add(settings, "lightZ", -15, 15, 0.1).name("แกน Z").onChange(updateLight);
    lightFolder.add(settings, "lightIntensity", 0, 6, 0.05).name("ความสว่าง").onChange(updateLight);
    lightFolder.add(settings, "showLightMarker").name("โชว์กล่องกำเนิดแสง").onChange(updateLight);
    lightFolder.add(settings, "autoRotateLight").name("แสงหมุนอัตโนมัติ");

    const materialFolder = gui.addFolder("วัสดุตัวละคร (PBR)");
    materialFolder.addColor(settings, "baseColor").name("Base Color").onChange(updatePBR);
    materialFolder.add(settings, "metalness", 0, 1, 0.01).name("Metalness").onChange(updatePBR);
    materialFolder.add(settings, "roughness", 0, 1, 0.01).name("Roughness").onChange(updatePBR);

    const modelFolder = gui.addFolder("ปรับตำแหน่งหุ่นยนต์");
    modelFolder.add(settings, "modelX", -5, 5, 0.1).name("ตำแหน่ง X").onChange(updateModelPosition);
    modelFolder.add(settings, "modelY", -5, 5, 0.1).name("ตำแหน่ง Y").onChange(updateModelPosition);
    modelFolder.add(settings, "modelZ", -5, 5, 0.1).name("ตำแหน่ง Z").onChange(updateModelPosition);
    modelFolder.close();

    updateLight();

    /* ============================================================
       MOUSE CONTROL: SHIFT + DRAG = MOVE LIGHT
    ============================================================= */
    let draggingLight = false;
    let startX = 0, startY = 0;
    let startLightX = 0, startLightZ = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
        if (event.shiftKey) {
            draggingLight = true;
            controls.enabled = false;
            startX = event.clientX;
            startY = event.clientY;
            startLightX = settings.lightX;
            startLightZ = settings.lightZ;
            renderer.domElement.style.cursor = "grabbing";
        }
    });

    window.addEventListener("pointermove", (event) => {
        if (!draggingLight) return;

        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        settings.lightX = THREE.MathUtils.clamp(startLightX + dx * 0.03, -15, 15);
        settings.lightZ = THREE.MathUtils.clamp(startLightZ + dy * 0.03, -15, 15);

        updateLight();
        ctrlLightX.updateDisplay();
        ctrlLightZ.updateDisplay();
    });

    window.addEventListener("pointerup", () => {
        draggingLight = false;
        controls.enabled = true;
        renderer.domElement.style.cursor = "default";
    });

    /* ============================================================
       RESIZE
    ============================================================= */
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ============================================================
       ANIMATION LOOP
    ============================================================= */
    let autoRotateAngle = 0;

    function animate() {
        requestAnimationFrame(animate);

        if (settings.autoRotateLight) {
            autoRotateAngle += 0.01;
            const radius = Math.sqrt(
                settings.lightX * settings.lightX +
                settings.lightZ * settings.lightZ
            ) || 8;

            settings.lightX = radius * Math.cos(autoRotateAngle);
            settings.lightZ = radius * Math.sin(autoRotateAngle);

            updateLight();
            ctrlLightX.updateDisplay();
            ctrlLightZ.updateDisplay();
        }

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

})();
</script>

</body>
</html>
